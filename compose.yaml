# Grindstone on one host (ADR-01, SPEC-05). Volumes are mounted only where
# ADR-01 allows; networks keep each station away from the database, and the
# runner is on none; nothing mounts the Docker socket (I-09).
# Start: make up (runs make secrets first). Check: make smoke.
#
# Secrets are files under secrets/ (or $GRINDSTONE_SECRETS_DIR), 0600 and
# owned by the operator, on a Linux filesystem: a Windows drive such as
# /mnt/p shows every file as 0777, which the entrypoints refuse. Compose
# bind-mounts them with that owner and mode, so only an entrypoint holding
# DAC_READ_SEARCH reads one; it copies each into its service user's private
# tmpfs and drops the capability before the service starts (DEC-0501). Which
# container mounts which secret follows SPEC-05's secret table.
name: grindstone

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: grindstone
      POSTGRES_DB: grindstone
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grindstone -d grindstone"]
      interval: 5s
      timeout: 3s
      retries: 20
    # The official entrypoint keeps the image's default capabilities to read
    # its operator-owned secret and own its data directory (SPEC-05).
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  grindstone:
    build:
      context: .
      dockerfile: docker/grindstone.Dockerfile
    environment:
      GRINDSTONE_DB_HOST: postgres
      GRINDSTONE_DB_NAME: grindstone
      GRINDSTONE_DB_USER: grindstone
      GRINDSTONE_DB_PASSWORD_FILE: /run/gs/postgres_password
      # Operator listener :8080 (published on loopback) refuses the stations'
      # and the database's subnets; station listener :8081 is never published
      # and serves only the kernel MCP surface and host events (REQ-0512).
      GRINDSTONE_STATION_PORT: "8081"
      GRINDSTONE_OPERATOR_REFUSED_NETWORKS: 10.89.1.0/24,10.89.2.0/24
    secrets:
      - postgres_password
      - mcp_token_key
      - host_control_key
      - host_event_key
      - session_key
      - operator_password_hash
      - github_app_key
    volumes:
      - blobs:/var/lib/grindstone/blobs
      - repos:/var/lib/grindstone/repos
      - workspaces:/var/lib/grindstone/workspaces
      - runs:/var/lib/grindstone/runs
      - type: bind
        source: ./deploy/grindstone.toml
        target: /etc/grindstone/grindstone.toml
        read_only: true
    # db and agents are internal; control-egress reaches GitHub and carries
    # the published operator port (Docker publishes no ports on internal networks).
    networks: [db, agents, control-egress]
    ports:
      # Operator UI and API, on loopback only; put a TLS proxy in front to expose it.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
      - /run/gs:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    # Held by the entrypoint only; the service runs with every set empty.
    # SETPCAP lets it empty the bounding set as well.
    cap_add: [DAC_READ_SEARCH, SETUID, SETGID, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  agent-host:
    build:
      context: .
      dockerfile: docker/agent-host.Dockerfile
    secrets: [host_control_key, host_event_key, claude_oauth_token]
    volumes:
      - workspaces:/var/lib/grindstone/workspaces
      - sessions:/var/lib/grindstone/sessions
    # agents: reach the control plane's station listener.
    # agent-egress: open egress at T1 (ADR-55).
    networks: [agents, agent-egress]
    # Docker's init is PID 1 with the host its only child, so every agent
    # dies with the host (REQ-0507, DEC-0503).
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
      - /run/gs-host:uid=10002,gid=10002,mode=0700
    cap_drop: [ALL]
    # The entrypoint holds these; the host keeps exactly SETUID and SETGID.
    cap_add: [DAC_READ_SEARCH, CHOWN, SETUID, SETGID, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    volumes:
      - runs:/var/lib/grindstone/runs
    # No network in M1: checks depend only on the subject and the image (DEC-0505).
    network_mode: none
    healthcheck:
      test: ["CMD", "python", "-m", "grindstone_runner", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

# Fixed subnets, outside Docker's default address pools, so the operator
# listener can name the ones it refuses.
networks:
  db:
    internal: true
    ipam:
      config: [{subnet: 10.89.1.0/24}]
  agents:
    internal: true
    ipam:
      config: [{subnet: 10.89.2.0/24}]
  control-egress:
    ipam:
      config: [{subnet: 10.89.3.0/24}]
  agent-egress:
    ipam:
      config: [{subnet: 10.89.4.0/24}]

volumes:
  pgdata: {}
  blobs: {}
  repos: {}
  workspaces: {}
  runs: {}
  sessions: {}

secrets:
  postgres_password:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/postgres_password
  mcp_token_key:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/mcp_token_key
  host_control_key:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/host_control_key
  host_event_key:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/host_event_key
  session_key:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/session_key
  operator_password_hash:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/operator_password_hash
  github_app_key:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/github_app_key
  claude_oauth_token:
    file: ${GRINDSTONE_SECRETS_DIR:-./secrets}/claude_oauth_token
