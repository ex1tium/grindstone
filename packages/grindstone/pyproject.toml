[project]
name = "grindstone"
version = "0.0.0"
description = "Grindstone control plane: the domain-neutral kernel, its services and the factory SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.14.*"
dependencies = [
  "dbos==3.3.0",
  "fastapi==0.143.3",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "sqlalchemy==2.1.6",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"
